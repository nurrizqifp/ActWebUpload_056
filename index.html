                    <form action="upload.php" method="post" enctype="multipart/form-data">

                                <label for="fileToUpload"

                                    <h5 class="fw-semibold mb-1" id="dropzoneText">Pilih berkas untuk diunggah</h5>
                                    <p class="text-muted small mb-0" id="dropzoneSubtext">atau seret dan lepaskan file
                                        Anda di sini</p>
                                </label>

                                <div id="dropzonePreview" class="d-none w-100 position-relative">
                                    <button type="button"
                                        class="btn btn-sm btn-danger position-absolute top-0 end-0 rounded-circle d-flex align-items-center justify-content-center"

                                    </button>

                                    <div id="previewContent"
                                        class="d-flex flex-column align-items-center justify-content-center"
                                        style="min-height: 180px;">
                                    </div>

                                    <div class="mt-3 text-secondary font-monospace small px-3 text-truncate w-100 border-top pt-2"
                                        id="fileInfo">
                                        <i class="bi bi-file-earmark-check-fill text-success me-1"></i> <span
                                            id="fileName" class="text-break fw-semibold"></span>

                            </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const fileInput = document.getElementById('fileToUpload');
        const dropzone = document.getElementById('dropzone');
        const uploadLabel = document.getElementById('uploadLabel');

        const dropzonePreview = document.getElementById('dropzonePreview');
        const previewContent = document.getElementById('previewContent');
        const btnResetFile = document.getElementById('btnResetFile');
        const fileName = document.getElementById('fileName');

        fileInput.addEventListener('change', function () {
            handleFile(fileInput.files[0]);
        });

        btnResetFile.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            resetFileInput();
        });

        function resetFileInput() {
            fileInput.value = '';
            dropzone.classList.remove('has-preview');
            dropzonePreview.classList.add('d-none');
            uploadLabel.classList.remove('d-none');
            previewContent.innerHTML = '';
            fileName.textContent = '';
        }

        function handleFile(file) {
            if (!file) return;

            dropzone.classList.add('has-preview');
            uploadLabel.classList.add('d-none');
            dropzonePreview.classList.remove('d-none');

            fileName.textContent = file.name;

            const fileType = file.type;
            const objectURL = URL.createObjectURL(file);

            previewContent.innerHTML = '';

            if (fileType.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = objectURL;
                img.className = 'preview-media-element img-fluid';
                previewContent.appendChild(img);
            } else if (fileType.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = objectURL;
                video.className = 'preview-media-element w-100';
                video.controls = true;
                video.style.backgroundColor = '#000';
                previewContent.appendChild(video);
            } else if (fileType.startsWith('audio/')) {
                const audioIcon = document.createElement('div');
                audioIcon.className = 'text-center mb-2';
                audioIcon.innerHTML = `
                <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center mx-auto shadow-sm" style="width: 64px; height: 64px;">
                    <i class="bi bi-music-note-beamed fs-2"></i>
                </div>
            `;

                const audio = document.createElement('audio');
                audio.src = objectURL;
                audio.controls = true;
                audio.className = 'w-100 mt-3';

                previewContent.appendChild(audioIcon);
                previewContent.appendChild(audio);
            } else {
                const docIcon = document.createElement('div');
                docIcon.className = 'text-center py-3';
                const extension = file.name.split('.').pop().toUpperCase();

                let iconClass = 'bi-file-earmark-text text-secondary';
                if (extension === 'PDF') iconClass = 'bi-file-earmark-pdf text-danger';
                else if (['ZIP', 'RAR', 'TAR', 'GZ'].includes(extension)) iconClass = 'bi-file-earmark-zip text-warning';
                else if (['PHP', 'HTML', 'CSS', 'JS'].includes(extension)) iconClass = 'bi-file-earmark-code text-primary';

                docIcon.innerHTML = `
                <div class="mb-3">
                    <i class="bi ${iconClass}" style="font-size: 4rem;"></i>
                </div>
                <h5 class="fw-semibold text-secondary mb-1">Dokumen ${extension}</h5>
                <p class="text-muted small mb-0">${(file.size / 1024).toFixed(1)} KB</p>
            `;
                previewContent.appendChild(docIcon);
            }
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, e => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, e => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            }, false);
        });

        dropzone.addEventListener('drop', e => {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length > 0) {
                fileInput.files = files;
                handleFile(files[0]);
            }
        });
    </script>
